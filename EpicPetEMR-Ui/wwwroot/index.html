<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EpicPetEMR-Ui</title>
    <base href="/" />
    <link rel="stylesheet" href="css/bootstrap/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="EpicPetEMR-Ui.styles.css" rel="stylesheet" />
    <script src="/js/colorTools.js"></script>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
</head>

<body>
    <div id="app">
        <div class="app-splash">
            <div class="app-splash-inner">
                <div class="app-splash-logo">🐾</div>
                <div class="app-splash-title">PetChance EMR</div>
                <div class="app-splash-bar-track">
                    <div class="app-splash-bar-fill"></div>
                </div>
                <div class="app-splash-pct"></div>
            </div>
        </div>
        <!-- kept hidden so Blazor can write --blazor-load-percentage to :root -->
        <svg class="loading-progress" style="display:none;">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text" style="display:none;"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
