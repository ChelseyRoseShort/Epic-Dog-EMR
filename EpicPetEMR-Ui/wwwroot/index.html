<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EpicPetEMR-Ui</title>
    <base href="/" />
    <link rel="stylesheet" href="css/bootstrap/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="EpicPetEMR-Ui.styles.css" rel="stylesheet" />
    <script src="/js/colorTools.js"></script>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
</head>

<body>
    <div id="app"></div>

    <div class="app-splash" id="app-splash">
        <div class="app-splash-inner">
            <i class="fa-solid fa-paw app-splash-icon"></i>
            <div class="app-splash-title">PetChance EMR</div>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>
    <script src="_framework/blazor.webassembly.js" autostart="false"></script>
    <script>
        (function () {
            var MIN_MS = 2200;
            var timerDone = false;
            var blazorDone = false;

            function tryHide() {
                if (!timerDone || !blazorDone) return;
                var el = document.getElementById('app-splash');
                if (el) el.classList.add('app-splash-hide');
            }

            // Minimum display time — never hide before this
            setTimeout(function () { timerDone = true; tryHide(); }, MIN_MS);

            // Detect when Blazor has actually rendered content into #app
            var app = document.getElementById('app');
            var observer = new MutationObserver(function () {
                if (app.childElementCount > 0) {
                    blazorDone = true;
                    observer.disconnect();
                    tryHide();
                }
            });
            observer.observe(app, { childList: true });

            // Start Blazor immediately so it loads in parallel with the timer
            Blazor.start();
        })();
    </script>
</body>

</html>
